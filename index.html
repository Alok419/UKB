<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BOM Extractor</title>
    <style>
        :root {
            --primary: #1a73e8; 
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --border-color: #dadce0;
            --text-color: #202124;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
        }
        h1 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
        }
        select, input[type="text"], input[type="file"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-style: italic;
            color: #5f6368;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error {
            color: #d93025;
            background: #fce8e6;
            padding: 15px;
            border-radius: 4px;
            display: none;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            display: none;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f1f3f4;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #downloadBtn {
            display: none;
            background-color: #34a853;
        }
        #downloadBtn:hover {
            background-color: #2d8c45;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI BOM Extractor</h1>
    <p style="text-align: center; color: #5f6368; margin-bottom: 30px;">Choose your AI provider, upload an engineering drawing (PDF), and extract the Bill of Materials.</p>
    
    <div id="error"></div>

    <!-- Hidden API Key field (receives key from Salesforce LWC) -->
    <input type="hidden" id="apiKey">

    <div class="form-row">
        <div class="form-group">
            <label for="provider">AI Provider</label>
            <select id="provider">
                <option value="gemini">Google Gemini</option>
                <option value="openai">OpenAI</option>
            </select>
        </div>
        <div class="form-group">
            <label for="modelName">Model Name</label>
            <input type="text" id="modelName" value="gemini-1.5-flash" required>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
        <label for="fileInput">Engineering Drawing (PDF)</label>
        <input type="file" id="fileInput" accept="application/pdf" required>
    </div>

    <div class="actions">
        <button id="extractBtn">Extract BOM</button>
        <button id="downloadBtn">Download CSV</button>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="statusText">Analyzing PDF and extracting BOM...</div>
    </div>

    <table id="bomTable">
        <thead>
            <tr>
                <th>ITEM</th>
                <th>QTY</th>
                <th>DESCRIPTION</th>
                <th>LENGTH</th>
                <th>NOTE</th>
                <th>RATING</th>
            </tr>
        </thead>
        <tbody id="bomBody">
            <!-- Rows will be injected here -->
        </tbody>
    </table>
</div>

<script>
    let extractedData = null;

    // Automatically update default model when provider changes
    document.getElementById('provider').addEventListener('change', (e) => {
        const modelInput = document.getElementById('modelName');
        if(e.target.value === 'gemini') {
            modelInput.value = 'gemini-1.5-flash';
        } else {
            modelInput.value = 'gpt-4o'; // Or gpt-5.6
        }
    });

    // Listen for the API Key from the Salesforce LWC
    window.addEventListener("message", (event) => {
        if (event.data && (event.data.type === 'SET_GEMINI_API_KEY' || event.data.type === 'SET_OPENAI_API_KEY')) {
            document.getElementById('apiKey').value = event.data.key;
            console.log("API Key successfully received from Salesforce LWC.");
        }
    }, false);

    document.getElementById('extractBtn').addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const provider = document.getElementById('provider').value;
        const modelName = document.getElementById('modelName').value.trim();
        const fileInput = document.getElementById('fileInput');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const table = document.getElementById('bomTable');
        const tbody = document.getElementById('bomBody');
        const downloadBtn = document.getElementById('downloadBtn');

        // Reset UI
        errorDiv.style.display = 'none';
        table.style.display = 'none';
        downloadBtn.style.display = 'none';
        tbody.innerHTML = '';
        extractedData = null;

        if (!apiKey) {
            showError("API Key not found. Ensure the component is loaded in Salesforce and the Custom Label is set.");
            return;
        }
        if (!fileInput.files.length) {
            showError("Please select a PDF file.");
            return;
        }

        const file = fileInput.files[0];
        
        try {
            document.getElementById('extractBtn').disabled = true;
            loadingDiv.style.display = 'block';

            // Convert PDF to Base64
            const base64Data = await fileToBase64(file);
            const base64String = base64Data.split(',')[1];
            
            const promptText = `You are an expert engineering assistant. Review the attached engineering drawing.
Find the Bill of Materials (BOM) tables. They usually have headers like ITEM, QTY, DESCRIPTION, LENGTH, NOTE, RATING.
Carefully extract every single row of the BOM table.
Return the result PURELY as a JSON object with a single key 'items', which is an array of objects.
Each object must have these string keys: item_number, quantity, description, length, note, rating.
Output ONLY valid JSON. Do not include markdown formatting blocks.`;

            let responseText = "";

            if (provider === 'gemini') {
                // --- GOOGLE GEMINI LOGIC ---
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: "application/pdf", data: base64String } }
                        ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.error?.message || "Gemini API Error");
                
                responseText = result.candidates[0].content.parts[0].text;

            } else {
                // --- OPENAI LOGIC ---
                const url = `https://api.openai.com/v1/responses`;
                const payload = {
                    model: modelName,
                    input: [
                        {
                            role: "user",
                            content: [
                                { type: "input_file", filename: file.name, file_data: `data:application/pdf;base64,${base64String}` },
                                { type: "input_text", text: promptText }
                            ]
                        }
                    ]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                // IMPORTANT: Let's log exactly what OpenAI sends back so we can see it!
                console.log("Raw OpenAI Result:", result);

                if (!response.ok) throw new Error(result.error?.message || "OpenAI API Error");
                
                // Try every possible location the text might be hiding in the new API
                responseText = result.output_text 
                    || (result.output && result.output.text) 
                    || (result.choices && result.choices[0] && result.choices[0].message && result.choices[0].message.content)
                    || result.text 
                    || "";
                    
                if (!responseText) {
                    throw new Error("The API succeeded, but the response text was completely empty. Check the browser console to see what OpenAI sent.");
                }
            }

            if (typeof responseText === 'object') {
                console.log("Response text is already an object:", responseText);
                extractedData = responseText;
            } else if (typeof responseText === 'string') {
                console.log("Raw String from Model before cleanup:", responseText);
                responseText = responseText.replace(/```json/gi, '').replace(/```/g, '').trim();
                console.log("Cleaned String ready for parsing:", responseText);
                try {
                    extractedData = JSON.parse(responseText);
                    console.log("Successfully parsed JSON string to object:", extractedData);
                } catch (e) {
                    console.error("Failed to parse JSON string:", responseText);
                    throw new Error("Model returned invalid JSON format.");
                }
            }

            // Fallback 1: If the model returned an array directly instead of { items: [...] }
            if (Array.isArray(extractedData)) {
                console.log("Model returned an array directly. Wrapping in { items: [...] }");
                extractedData = { items: extractedData };
            }

            // Fallback 2: If the array is hiding under a different key like "bom" or "data"
            if (extractedData && !extractedData.items) {
                console.log("No 'items' key found. Searching object for any array...");
                for (let key in extractedData) {
                    if (Array.isArray(extractedData[key])) {
                        console.log(`Found array under key: '${key}'. Mapping to 'items'.`);
                        extractedData.items = extractedData[key];
                        break;
                    }
                }
            }

            // Deep Fallback: If OpenAI nested the text in a standard Chat Completion format inside an object
            if (extractedData && extractedData.choices && Array.isArray(extractedData.choices)) {
                console.log("Detected nested choices array (Standard OpenAI Chat format). Extracting content...");
                let content = extractedData.choices[0]?.message?.content;
                console.log("Nested content:", content);
                if (typeof content === 'string') {
                    content = content.replace(/```json/gi, '').replace(/```/g, '').trim();
                    let parsedContent = JSON.parse(content);
                    console.log("Parsed nested content:", parsedContent);
                    extractedData = Array.isArray(parsedContent) ? { items: parsedContent } : parsedContent;
                    if (!extractedData.items) {
                        for (let key in extractedData) {
                            if (Array.isArray(extractedData[key])) extractedData.items = extractedData[key];
                        }
                    }
                }
            }

            if (!extractedData || !extractedData.items || !Array.isArray(extractedData.items) || extractedData.items.length === 0) {
                console.error("Final Extracted Data completely failed to find an array:", extractedData);
                showError("No BOM items were found. Check browser console (F12) for the Raw Extracted Data.");
                return;
            }
            
            console.log("Final success! Extracted Items Array:", extractedData.items);

            // Render the Table
            extractedData.items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(item.item_number)}</td>
                    <td>${escapeHtml(item.quantity)}</td>
                    <td>${escapeHtml(item.description)}</td>
                    <td>${escapeHtml(item.length)}</td>
                    <td>${escapeHtml(item.note)}</td>
                    <td>${escapeHtml(item.rating)}</td>
                `;
                tbody.appendChild(tr);
            });

            table.style.display = 'table';
            downloadBtn.style.display = 'block';

        } catch (err) {
            console.error(err);
            showError("Error: " + err.message);
        } finally {
            document.getElementById('extractBtn').disabled = false;
            loadingDiv.style.display = 'none';
        }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!extractedData || !extractedData.items) return;

        let csvContent = "ITEM,QTY,DESCRIPTION,LENGTH,NOTE,RATING\n";
        
        extractedData.items.forEach(item => {
            const row = [
                `"${(item.item_number || '').replace(/"/g, '""')}"`,
                `"${(item.quantity || '').replace(/"/g, '""')}"`,
                `"${(item.description || '').replace(/"/g, '""')}"`,
                `"${(item.length || '').replace(/"/g, '""')}"`,
                `"${(item.note || '').replace(/"/g, '""')}"`,
                `"${(item.rating || '').replace(/"/g, '""')}"`
            ].join(",");
            csvContent += row + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", "extracted_bom.csv");
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return '---';
        return unsafe.toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }
    
    function showError(msg) {
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
    }
</script>

</body>
</html>
