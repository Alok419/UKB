<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BOM Extractor</title>
    <style>
        :root {
            --primary: #1a73e8; 
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --border-color: #dadce0;
            --text-color: #202124;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
        }
        h1 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
        }
        select, input[type="text"], input[type="file"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-style: italic;
            color: #5f6368;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error {
            color: #d93025;
            background: #fce8e6;
            padding: 15px;
            border-radius: 4px;
            display: none;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            display: none;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f1f3f4;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #downloadBtn {
            display: none;
            background-color: #34a853;
        }
        #downloadBtn:hover {
            background-color: #2d8c45;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI BOM Extractor</h1>
    <p style="text-align: center; color: #5f6368; margin-bottom: 30px;">Choose your AI provider, upload an engineering drawing (PDF), and extract the Bill of Materials.</p>
    
    <div id="error"></div>

    <!-- Hidden API Key field (receives key from Salesforce LWC) -->
    <input type="hidden" id="apiKey">

    <div class="form-row">
        <div class="form-group">
            <label for="modelName">Model Name</label>
            <input type="text" id="modelName" value="gpt-4o" required>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
        <label for="fileInput">Engineering Drawing (PDF)</label>
        <input type="file" id="fileInput" accept="application/pdf" required>
    </div>

    <div class="actions">
        <button id="extractBtn">Extract BOM</button>
        <button id="downloadBtn">Download JSON</button>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="statusText">Analyzing PDF and extracting BOM...</div>
    </div>

    <div id="resultsContainer"></div>
</div>

<script>
    let extractedData = null;

    // Listen for the API Key from the Salesforce LWC
    window.addEventListener("message", (event) => {
        if (event.data && (event.data.type === 'SET_GEMINI_API_KEY' || event.data.type === 'SET_OPENAI_API_KEY' || event.data.key)) {
            document.getElementById('apiKey').value = event.data.key;
            console.log("API Key successfully received from Salesforce LWC.");
        }
    }, false);

    document.getElementById('extractBtn').addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const modelName = document.getElementById('modelName').value.trim();
        const fileInput = document.getElementById('fileInput');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const table = document.getElementById('bomTable');
        const tbody = document.getElementById('bomBody');
        const downloadBtn = document.getElementById('downloadBtn');

        // Reset UI
        errorDiv.style.display = 'none';
        table.style.display = 'none';
        downloadBtn.style.display = 'none';
        tbody.innerHTML = '';
        extractedData = null;

        if (!apiKey) {
            showError("API Key not found. Ensure the component is loaded in Salesforce and the Custom Label is set.");
            return;
        }
        if (!fileInput.files.length) {
            showError("Please select a PDF file.");
            return;
        }

        const file = fileInput.files[0];
        
        try {
            document.getElementById('extractBtn').disabled = true;
            loadingDiv.style.display = 'block';

            // Convert PDF to Base64
            const base64Data = await fileToBase64(file);
            const base64String = base64Data.split(',')[1];
            
            const promptText = `ROLE
You are an Engineering Drawing and Bill of Materials (BOM) Extraction Assistant.
Your task is to analyze the complete engineering drawing provided as input and extract a COMPLETE, ACCURATE, SOURCE-BASED Bill of Materials (BOM).
The documents may contain:
- Engineering drawings
- BOM / Parts Lists
- Assembly drawings
- Wire harness drawings
- Component drawings
- Wiring diagrams
- Connector information
- Terminal information
- Wire specifications
- Dimensions
- Manufacturing instructions
- Quality requirements
- Revision information
- Drawing references
- Assembly / folding instructions

==================================================
PRIMARY OBJECTIVE
==================================================
Create a COMPLETE structured BOM for the assembly represented by the supplied engineering drawing.
The BOM must be based ONLY on information explicitly available in the supplied document.
Your priority order is:
1. ACCURACY
2. COMPLETENESS
3. SOURCE TRACEABILITY
4. PRESERVATION OF ORIGINAL VALUES
5. STRUCTURED OUTPUT

==================================================
CRITICAL SOURCE-ONLY RULE
==================================================
Use ONLY the supplied engineering drawing/document as the source.
DO NOT use outside knowledge.
DO NOT search the internet.
DO NOT infer missing information from common engineering practices.
DO NOT guess.
DO NOT create information that is not present in the document.
If information cannot be determined from the document, return null.
Never fabricate a part number, quantity, specification, manufacturer, supplier, dimension, wire length, or other value.

==================================================
COMPLETE BOM EXTRACTION
==================================================
The objective is to extract the COMPLETE BOM.
DO NOT return only a sample.
DO NOT return only the first few BOM rows.
DO NOT intentionally limit the number of BOM items.
DO NOT stop extraction after finding several items.
DO NOT skip rows because they appear repetitive.
DO NOT skip rows because some fields are blank.
If a BOM or parts table contains 50 rows, evaluate all 50 rows.
If a BOM or parts table contains 100 rows, evaluate all 100 rows.
Every identifiable BOM/parts-list row must be evaluated.
If a row contains incomplete information:
- Preserve the row.
- Extract the information that is available.
- Set unavailable fields to null.
Do NOT remove the row simply because some information is missing.

==================================================
DOCUMENT STRUCTURE
==================================================
First determine the document structure.
Identify:
- Drawing number
- Part number
- Revision
- Title
- Document status
- Number of sheets/pages
Then analyze EVERY available sheet/page.
Do not assume that Sheet 1 contains the entire BOM.
BOM information may appear on:
- Sheet 1
- Sheet 2
- Sheet 3
- Additional sheets
Analyze all supplied sheets/pages.

==================================================
SHEET VALIDATION
==================================================
Determine the actual number of sheets/pages in the supplied document.
Never create a sheet number that does not exist.
For example:
If the document contains 4 sheets:
Valid source_sheet values are:
1
2
3
4
Do NOT output:
5
6
7
etc.
If the source location cannot be reliably identified, use null.
Never guess a sheet number.

==================================================
WHAT COUNTS AS A BOM ITEM
==================================================
Treat an item as a BOM item when it is explicitly identified as a component/part in:
- BOM table
- Parts list
- Item table
- Component list
- Material list
- Assembly parts list
Examples may include:
- Housing
- Connector
- Terminal
- Terminal splice
- Grommet
- Wire
- Cable
- Tape
- Heat shrink
- Lock plate
- Label
- Sensor
- Thermistor
- Retainer
- Plug
- Other explicitly listed component
Do NOT automatically treat every number appearing in a drawing as a BOM item.
Do NOT treat dimensions as quantities.
Do NOT treat wire routing numbers as item numbers unless the document explicitly identifies them as BOM/part items.
Do NOT treat drawing numbers as component part numbers unless explicitly identified as such.

==================================================
BOM TABLE PRIORITY
==================================================
When a formal BOM/Parts List table exists, it has the highest priority for BOM extraction.
Extract the values from the BOM table exactly as shown.
Typical fields may include:
- Item
- Quantity
- Description
- Part Number
- Length
- Notes
- Rating
- Manufacturer
- GE Code
- Supplier Code
If a formal BOM table exists, do not replace its information with information inferred from the drawing.

==================================================
ITEM NUMBER
==================================================
Extract the original item number exactly as shown.
Example:
1
2
3
7
20
42
Do not renumber the BOM.
If the drawing skips item numbers, preserve the skipped numbering.
Do not assume that missing item numbers represent missing parts.

==================================================
PART NUMBER
==================================================
Extract the exact part number shown in the document.
Rules:
- Never invent a part number.
- Never derive a part number from a description.
- Never modify punctuation.
- Never remove letters.
- Never remove leading zeros.
- Preserve suffixes and prefixes.
If no part number is explicitly available, return null.

==================================================
DESCRIPTION
==================================================
Extract the complete description.
Preserve the wording from the document as much as possible.
Do not unnecessarily shorten the description.
For example, if the drawing says:
"GROMMET ELECT 294D1798P001 / For Supplier HK DongA: 294D3916P001"
do not reduce it to:
"Grommet"
Instead preserve the complete source description and separately identify the applicable supplier-specific information when possible.

==================================================
QUANTITY
==================================================
Extract the exact quantity shown in the document.
Rules:
- Do not calculate quantity.
- Do not estimate quantity.
- Do not assume quantity based on the drawing.
- Do not multiply quantities.
- Do not combine quantities unless the drawing explicitly provides a combined quantity.
If quantity is not explicitly available, return null.

==================================================
MANUFACTURER / SUPPLIER
==================================================
Only identify a manufacturer or supplier when the document explicitly provides it.
Distinguish between:
- Manufacturer
- Supplier
- Supplier-specific part number
- GE Code
- Manufacturer Part Number
Do not assume that a company mentioned next to a supplier-specific part number is the manufacturer.
Example:
If the document states:
"For Supplier HK DongA: 294D3916P001"
then represent this as supplier-specific information.
Do not automatically classify HK DongA as the manufacturer of the original component.

==================================================
GE CODE / SUPPLIER CODE
==================================================
If the document contains:
- GE Code
- Supplier Code
- Internal Code
- Manufacturer Code
preserve the exact value.
Do not confuse these identifiers with the main part number.
For example:
Part Number:
294D1798P001
Supplier-specific Part Number:
294D3916P001
Supplier:
HK DongA
These should remain separate fields when the source supports that distinction.

==================================================
MATERIAL
==================================================
Extract material only when explicitly stated.
Examples:
- PVC
- Copper
- Tin
- Steel
- Plastic
Do not infer material from component type.
If material is not specified, return null.

==================================================
SPECIFICATION
==================================================
Extract explicitly stated specifications.
Examples:
- UL 1015
- UL 1569
- CSA
- GE Specification
- Engineering Specification
- Terminal Specification
Do not invent specifications.

==================================================
RATING
==================================================
Extract ratings exactly as shown.
Examples:
- V0
- VW-1
- FT-1
- UL rating
- CSA rating
- Voltage rating
- Temperature rating
Do not infer ratings.

==================================================
LENGTH AND DIMENSIONS
==================================================
Extract lengths exactly as shown.
Preserve the original unit.
Examples:
55 IN
127 MM
2.50 IN
DO NOT convert units.
If the document shows:
10.00 [254]
preserve both values rather than calculating or replacing one with the other.
Do not confuse:
- Component length
- Wire length
- Dimension
- Tape length
- Distance from reference point
Only put a value into the BOM "length" field if it belongs to that BOM item.

==================================================
WIRE INFORMATION
==================================================
Wire information must be extracted separately from general BOM components when possible.
For every explicitly identifiable wire/cable, extract:
- Item number
- Wire code
- Description
- Color
- Gauge/AWG
- Strand information
- Material
- Insulation
- Wall thickness
- Voltage rating
- Temperature rating
- UL style
- CSA rating
- GE code
- Length
- Length unit
- From
- To
- Terminal reference
- Connector reference
- Source sheet
- Source location
Do not infer wire color from wire code.
Do not infer gauge from wire code.
Do not infer length.
Do not calculate wire length from drawing dimensions.
Use only explicitly stated information.

==================================================
WIRE CODE
==================================================
Preserve wire codes exactly as shown.
Examples may include:
WB
YX
RX
WX
BX
NX
VW
GY
OX
Do not assume that a wire code automatically represents a color or gauge unless the document explicitly provides that mapping.

==================================================
FROM / TO
==================================================
If the drawing explicitly identifies wire destinations, capture them.
Examples:
FROM -A
TO WATER VALVE
TO DISPENSER BOARD
TO HARNESS CAB
Do not infer the destination from the visual routing unless the document explicitly identifies it.

==================================================
CONNECTORS AND TERMINALS
==================================================
Distinguish between:
- Connector
- Housing
- Terminal
- Terminal splice
- Lock plate
- Plug
- Connector assembly
Do not combine separate components into one BOM item unless the drawing explicitly defines them as one part.

==================================================
DUPLICATE PARTS
==================================================
If the same part number appears multiple times:
1. Check whether the BOM explicitly provides a total quantity.
2. If a total quantity is explicitly provided, use that quantity.
3. If individual occurrences are separately identified and no combined quantity is provided, preserve the individual rows.
4. Do not calculate a total quantity yourself unless the document explicitly provides it.
Do not remove duplicate-looking rows simply because they have the same part number.

==================================================
ASSEMBLY INSTRUCTIONS
==================================================
Assembly instructions are NOT automatically BOM items.
Examples:
- Tape must be applied close to grommet.
- Tape must overlap.
- Harness must be folded.
- Connector must be positioned in a particular orientation.
- Wire must be tied.
- Heat shrink must overlap terminal.
Store these under:
assembly_instructions
Do not place them inside bom[] unless the instruction explicitly identifies a material/component and its quantity as a BOM item.

==================================================
QUALITY REQUIREMENTS
==================================================
Quality and testing requirements must be stored separately.
Examples:
- Continuity test
- UL certification
- CSA certification
- Flame rating
- Pull force
- Critical-to-quality requirements
- Inspection requirements
Do not convert a test requirement into a BOM item.
For example:
"100% continuity test"
is a quality requirement, not a component.

==================================================
DRAWING REFERENCES
==================================================
If the drawing references another drawing, specification, standard, or part:
Record:
- Reference number
- Description
- Purpose
Do NOT invent the contents of the referenced document.
If only a reference number is available, preserve the reference number and leave unsupported fields null.

==================================================
REVISION INFORMATION
==================================================
Extract:
- Drawing number
- Part number
- Revision
- Title
- Status
- Revision/change information when explicitly available
Do not assume that a higher revision is newer unless the document explicitly establishes that.

==================================================
UNCONTROLLED / RELEASED STATUS
==================================================
If the drawing states:
- Released
- Uncontrolled if printed
- Not Released
- Cancelled
preserve the status exactly.
Do not interpret "Uncontrolled if printed" as a BOM item or component.

==================================================
SOURCE TRACEABILITY
==================================================
Every extracted BOM item must include:
- source_sheet
- source_location
Source location examples:
- BOM Table
- Parts List
- Wire Specification Table
- Sheet 2 routing diagram
- Detail K
- Note 9
- Title Block
Only use a source location that can be supported by the document.
Do not invent coordinates or page numbers.

==================================================
CONFIDENCE
==================================================
Assign confidence to each extracted item:
HIGH:
Information is explicitly listed in a BOM/Parts List or clearly readable table.
MEDIUM:
Information is explicitly visible elsewhere in the engineering drawing but not in a formal BOM table.
LOW:
Information is partially readable, ambiguous, or uncertain.
Do not use HIGH confidence for guessed or inferred information.

==================================================
NO MATHEMATICAL CALCULATIONS
==================================================
Do NOT perform calculations.
Do NOT:
- Add quantities
- Multiply quantities
- Calculate total wire length
- Convert units
- Calculate dimensions
- Calculate material requirements
- Calculate costs
- Calculate weight
- Calculate totals
Only extract values exactly as provided.

==================================================
NO HALLUCINATION
==================================================
If information is missing:
Return:
null
Do not write:
Unknown
Probably
Likely
Estimated
Assumed
unless the information itself appears in the source.
Never fabricate information to make the JSON complete.

==================================================
CONFLICT HANDLING
==================================================
If two locations in the document appear to contain conflicting information:
DO NOT choose one using assumptions.
Instead:
1. Preserve the values that are explicitly shown.
2. Record the conflict under validation_notes.
3. Identify the source sheets/locations involved.
4. Mark the affected information appropriately.
Example:
"Sheet 1 shows quantity 3, while Sheet 3 appears to show quantity 2."
Do not silently resolve the conflict.

==================================================
COMPLETENESS VALIDATION
==================================================
Before producing the final answer, perform an internal completeness check.
Check:
1. Did you analyze every supplied sheet?
2. Did you identify the actual sheet count?
3. Did you extract every BOM/parts-list row?
4. Did you preserve every item number?
5. input you preserve every quantity?
6. Did you preserve every part number?
7. Did you preserve complete descriptions?
8. Did you capture supplier/manufacturer information?
9. Did you capture GE/supplier codes?
10. Did you separately capture wire information?
11. Did you separate assembly instructions from BOM items?
12. Did you separate quality requirements from BOM items?
13. Did you avoid calculations?
14. Did you avoid inferred values?
15. Did you avoid invented sheet numbers?
16. Did you avoid duplicate removal without evidence?
17. Did you identify missing/unreadable information?
If a BOM row exists but some fields are unavailable, KEEP THE ROW and set unavailable fields to null.

==================================================
BOM COMPLETENESS STATUS
==================================================
Return a BOM validation section.
Only mark:
"bom_complete": true
when all identifiable BOM rows from the supplied document have been extracted.
If some BOM rows could not be read because of document quality, image quality, missing pages, or inaccessible content:
"bom_complete": false
and list those items/sheets in:
"missing_bom_items"
Do not claim completeness if the source does not support it.

==================================================
OUTPUT FORMAT
==================================================
Return ONLY valid JSON.
Do not return Markdown.
Do not return explanations outside the JSON.
Use the following exact structure:
{
  "document_information": {
    "drawing_number": null,
    "part_number": null,

  },

}

==================================================
FINAL RULE
==================================================
The final response must represent what is actually present in the engineering drawing.
Accuracy is more important than filling every field.
NEVER invent data.
NEVER guess.
NEVER calculate.
NEVER intentionally return a partial BOM.
NEVER create a sheet number that does not exist.
NEVER omit a BOM row merely because some fields are missing.
Extract everything that the supplied document actually supports.
`;

            let responseText = "";

            // --- OPENAI LOGIC ---
            const url = `https://api.openai.com/v1/chat/completions`;
            const payload = {
                model: modelName,
                messages: [
                    {
                        role: "user",
                        content: [
                            { type: "text", text: promptText },
                            { 
                                type: "file", 
                                file: {
                                    file_data: `data:application/pdf;base64,${base64String}`,
                                    filename: file.name
                                }
                            }
                        ]
                    }
                ]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            // IMPORTANT: Let's log exactly what OpenAI sends back so we can see it!
            console.log("Raw OpenAI Result:", result);

            if (!response.ok) throw new Error(result.error?.message || "OpenAI API Error");
            
            // Standard location for chat completions text
            responseText = result.choices && result.choices[0]?.message?.content;
                
            if (!responseText) {
                throw new Error("The API succeeded, but the response text was not found. Check the browser console to see what OpenAI sent.");
            }

            console.log("Raw String from Model before cleanup:", responseText);
            responseText = responseText.replace(/```json/gi, '').replace(/```/g, '').trim();
            console.log("Cleaned String ready for parsing:", responseText);
            try {
                extractedData = JSON.parse(responseText);
                console.log("Successfully parsed JSON string to object:", extractedData);
            } catch (e) {
                console.error("Failed to parse JSON string:", responseText);
                throw new Error("Model returned invalid JSON format.");
            }

            // Fallback 1: If the model returned an array directly instead of { items: [...] }
            if (Array.isArray(extractedData)) {
                console.log("Model returned an array directly. Wrapping in { items: [...] }");
                extractedData = { items: extractedData };
            }

            // Fallback 2: If the array is hiding under a different key like "bom" or "data"
            if (extractedData && !extractedData.items) {
                console.log("No 'items' key found. Searching object for any array...");
                for (let key in extractedData) {
                    if (Array.isArray(extractedData[key])) {
                        console.log(`Found array under key: '${key}'. Mapping to 'items'.`);
                        extractedData.items = extractedData[key];
                        break;
                    }
                }
            }

            // Deep Fallback: If OpenAI nested the text in a standard Chat Completion format inside an object
            if (extractedData && extractedData.choices && Array.isArray(extractedData.choices)) {
                console.log("Detected nested choices array (Standard OpenAI Chat format). Extracting content...");
                let content = extractedData.choices[0]?.message?.content;
                console.log("Nested content:", content);
                if (typeof content === 'string') {
                    content = content.replace(/```json/gi, '').replace(/```/g, '').trim();
                    let parsedContent = JSON.parse(content);
                    console.log("Parsed nested content:", parsedContent);
                    extractedData = parsedContent;
                }
            }

            if (!extractedData || typeof extractedData !== 'object') {
                showError("Failed to extract structured data. Check console for details.");
                return;
            }
            
            console.log("Final success! Extracted Data:", extractedData);

            // Render Dynamic Tables
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            
            // Render Document Info if available
            if (extractedData.document_information) {
                const infoDiv = document.createElement('div');
                infoDiv.style.marginBottom = '20px';
                infoDiv.innerHTML = `<h3>Document Information</h3><ul>
                    ${Object.entries(extractedData.document_information).map(([k,v]) => `<li><strong>${k}:</strong> ${escapeHtml(v)}</li>`).join('')}
                </ul>`;
                container.appendChild(infoDiv);
            }

            // Loop through all keys and generate tables for arrays
            Object.keys(extractedData).forEach(key => {
                const data = extractedData[key];
                if (Array.isArray(data) && data.length > 0) {
                    const tableWrapper = document.createElement('div');
                    tableWrapper.style.marginBottom = '30px';
                    tableWrapper.innerHTML = `<h3 style="text-transform: capitalize; margin-bottom: 10px;">${key.replace(/_/g, ' ')} (${data.length} items)</h3>`;
                    
                    const table = document.createElement('table');
                    table.style.display = 'table';
                    
                    // Create headers based on the keys of the first item
                    const headers = Object.keys(data[0]);
                    const thead = document.createElement('thead');
                    const headerRow = document.createElement('tr');
                    headers.forEach(h => {
                        const th = document.createElement('th');
                        th.textContent = h.replace(/_/g, ' ').toUpperCase();
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);
                    table.appendChild(thead);
                    
                    // Create rows
                    const tbody = document.createElement('tbody');
                    data.forEach(item => {
                        const tr = document.createElement('tr');
                        headers.forEach(h => {
                            const td = document.createElement('td');
                            td.innerHTML = escapeHtml(item[h]);
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    
                    tableWrapper.appendChild(table);
                    container.appendChild(tableWrapper);
                }
            });

            document.getElementById('downloadBtn').style.display = 'block';

        } catch (err) {
            console.error(err);
            showError("Error: " + err.message);
        } finally {
            document.getElementById('extractBtn').disabled = false;
            loadingDiv.style.display = 'none';
        }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!extractedData) return;
        
        const jsonContent = JSON.stringify(extractedData, null, 2);
        const blob = new Blob([jsonContent], { type: 'application/json' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", "extracted_bom_data.json");
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return '---';
        return unsafe.toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }
    
    function showError(msg) {
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
    }
</script>

</body>
</html>
